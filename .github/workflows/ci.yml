name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,research,graph,semantic]" -c requirements.lock
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Frontend type check
        run: npm run typecheck --prefix web
      - name: Frontend production build
        run: npm run build --prefix web
      - name: Packaged UI matches frontend source
        run: git diff --exit-code -- src/tracedesk/web
      - name: Python static checks
        run: python -m ruff check src tests scripts
      - name: Python formatting
        run: python -m ruff format --check src tests scripts
      - name: Behavior and transport tests
        run: python -m pytest -q --junitxml=reports/junit.xml
      - name: Retrieval ablations and workflow regression
        run: python -m tracedesk.cli evaluate --output reports/evaluation.json
      - name: Build distribution
        run: python -m build --outdir dist
      - name: Install wheel and exercise real HTTP outside checkout
        run: >-
          python scripts/verify_wheel.py --dist-dir dist
          --work-dir "${{ runner.temp }}/tracedesk-wheel-validation"
          --report reports/wheel-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          path: |
            reports/
            dist/
            ${{ runner.temp }}/tracedesk-wheel-validation/*.log
          retention-days: 14

  browser:
    name: Chromium / real HTTP UI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e ".[dev,research,graph,semantic]" -c requirements.lock
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - name: Install isolated CI browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Chinese fonts for visual regression
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser tests against the real backend
        working-directory: web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 14

  neo4j:
    name: Neo4j 5.26 / real isolated graph queries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      graph:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: "none"
        ports:
          - 7687:7687
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install graph runtime
        run: python -m pip install -e ".[graph]" -c requirements.lock
      - name: Wait for a real health query, import, search, and verify isolated cleanup
        run: >-
          python scripts/verify_neo4j.py --uri bolt://127.0.0.1:7687
          --timeout 90 --output reports/neo4j-live.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neo4j-live-validation
          path: reports/neo4j-live.json
          retention-days: 14

  graphrag-compatibility:
    name: Microsoft GraphRAG / official API compatibility only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned official GraphRAG package and its real dependencies
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/graphrag-api-env"
          "${RUNNER_TEMP}/graphrag-api-env/bin/python" -I -m pip install -e ".[graphrag]"
      - name: Import official APIs and bind the adapter call signatures without model calls
        shell: bash
        run: |
          "${RUNNER_TEMP}/graphrag-api-env/bin/python" -I - <<'PY'
          import inspect
          import json
          from importlib.metadata import version
          from pathlib import Path

          from graphrag.api.index import build_index
          from graphrag.api.query import global_search, local_search
          from graphrag.config.create_graphrag_config import create_graphrag_config
          from tracedesk.graphs.microsoft import SUPPORTED_GRAPHRAG_VERSION

          actual = version("graphrag")
          assert actual == SUPPORTED_GRAPHRAG_VERSION
          common = dict(config=None, entities=None, communities=None, community_reports=None,
                        community_level=2, response_type="Multiple Paragraphs", query="API signature probe")
          calls = [
              (create_graphrag_config, dict(values={}, root_dir=".")),
              (build_index, dict(config=None, method="standard", is_update_run=False, input_documents=None)),
              (local_search, dict(**common, text_units=None, relationships=None, covariates=None)),
              (global_search, dict(**common, dynamic_community_selection=False)),
          ]
          checked = []
          for function, arguments in calls:
              inspect.signature(function).bind(**arguments)
              if function is not create_graphrag_config:
                  assert inspect.iscoroutinefunction(inspect.unwrap(function))
              checked.append(function.__name__)
          report = dict(status="passed", package="graphrag", version=actual,
                        scope="Official package import and signature binding only",
                        checked_apis=checked, model_calls=0, index_build="not_run", quality="not_measured")
          output = Path("reports/graphrag-compatibility.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphrag-api-compatibility
          path: reports/graphrag-compatibility.json
          retention-days: 14
